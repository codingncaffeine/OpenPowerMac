name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the native core (copies libopmcapi.so into gui/native)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPM_BUILD_TESTS=OFF
          cmake --build build --target opmcapi
      - name: Build the Linux app
        run: dotnet build gui -c Release --nologo
      - name: The app carries the core
        run: test -f gui/bin/Release/net10.0/libopmcapi.so

  # musl: an Alpine user builds from source with Alpine's own compiler and
  # .NET SDK. Every push proves that still works, and that what was built runs.
  linux-musl:
    runs-on: ubuntu-latest
    container: alpine:latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Alpine packages
        run: >
          apk add --no-cache build-base cmake samurai dotnet10-sdk bash git icu-libs fontconfig
          ttf-dejavu sdl3 libx11 libice libsm libxi libxfixes libxcursor libxrandr libxext xvfb dbus
      - uses: actions/checkout@v4
      - name: Build the core and its tools
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Build the Linux app
        run: dotnet build gui -c Release --nologo
      - name: The app starts, loads the core and SDL3, and opens its window
        run: bash tools/headless.sh bash tools/launch-check.sh gui/bin/Release/net10.0/OpenPowerMac

  linux-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerPC cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-powerpc-linux-gnu
      - name: Build core tools
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPM_BUILD_TESTS=OFF
          cmake --build build
      - name: Build oracle corpus (GNU cross gcc — second toolchain)
        run: bash tests/oracle/build.sh build/oracle
      - name: Run differential oracle
        run: bash tools/run_oracle.sh build/oracle build/tools/ppcrun/ppcrun '[fim]*'
